<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FUELX Station Manager</title>
<style>
:root{--bg:#f3f5f8;--c:#fff;--t:#0B2545;--m:#566478;--b:#dde3ea;--p:#F58220;--n:#0B2545;--nt:#fff;--ok:#1B8A5A;--bad:#c92a2a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#071729;--c:#0f2744;--t:#eef2f7;--m:#9fb0c5;--b:#1f3d63;--p:#F58220;--n:#F58220;--nt:#0B2545;--ok:#4cc38a;--bad:#ff8787;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--c);border-bottom:3px solid var(--p);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.lg{background:#fff;border-radius:10px;padding:4px 10px}.lg svg{height:44px;width:auto;display:block}.lgb{text-align:center;background:#fff;border-radius:12px;padding:12px;margin-bottom:12px}.lgb svg{height:80px;max-width:100%;width:auto}.logo{font-weight:800;font-size:18px;color:var(--p)}.logo small{display:block;font-size:10px;color:var(--m);font-weight:500}

h2{margin:0 0 12px;font-size:20px;color:var(--n)}h3{margin:0 0 10px;font-size:15px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--b);white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--m)}td.n,th.n{text-align:right}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);width:100%}label{font-size:12px;color:var(--m);display:block}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.btn{background:var(--p);color:#0B2545;border:0;padding:9px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.btn.g{background:var(--bg);color:var(--t);border:1px solid var(--b)}.btn.s{padding:4px 9px;font-size:12px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.m{color:var(--m)}.bar{height:8px;background:var(--b);border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#F58220,#1B8A5A)}
.login{max-width:420px;margin:8vh auto}.msg{padding:8px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--b);margin-bottom:10px}
@media print{header,nav,.np{display:none!important}body{background:#fff;color:#000}}
</style></head><body><div id="app"><div class="login card"><div id=ll></div><p class=m style="text-align:center">Loading…</p></div></div>
<script>
const ST=['Kasoa','Asumura','Tagina','Hiayeya','Nyamebekyere','Kobro','Appiankwanta'],PR=['Petrol','Diesel'],PUMPS=[['P1','Petrol'],['P2','Petrol'],['P3','Diesel'],['P4','Diesel']],
CATS=['Salaries & wages','Utilities (power/water)','Maintenance & repairs','Licences & levies','Security','Transport','Bank charges','Stationery & supplies','Other'],
RN={ceo:'Chief Executive Officer',ops:'Operations Head',acc:'Accountant',mgr:'Station Manager'},
NAV=[['dash','Dashboard'],['sales','Daily Sales'],['stock','Tanks & Deliveries'],['exp','Expenses'],['bank','Cash & Banking'],['rep','Reports'],['set','Prices & Setup'],['staff','Staff & Access']],
PERM={sale:'mgr ops ceo',verify:'acc ops ceo',deliv:'mgr ops ceo',dip:'mgr ops ceo',exp:'mgr acc ceo',bank:'mgr acc ceo',price:'ops ceo',setup:'ops ceo',del:'ceo'},
COLL={staff:'staff',st:'stations',sales:'sales',deliv:'deliveries',dips:'dips',exp:'expenses',bank:'banking',log:'audit',cfg:'config'};
let LOCK=false,DB,UID,OWN=false,ME=null,V='dash',SC='ALL',RP={t:'sum'},LOADED={},S={staff:[],st:[],sales:[],deliv:[],dips:[],exp:[],bank:[],log:[],cfg:[]},dirty=false;
const $=id=>document.getElementById(id),F=n=>Number(n||0).toLocaleString('en-GH',{maximumFractionDigits:2}),M=n=>'GH₵ '+F(n),iso=d=>d.toISOString().slice(0,10),TD=()=>iso(new Date());
const can=a=>ME&&PERM[a].split(' ').includes(ME.role),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const scope=()=>ME.role=='mgr'?[ME.station]:SC=='ALL'?ST:[SC],by=(a,st)=>a.filter(x=>st.includes(x.st)),own=st=>ME.role!='mgr'||ME.station==st;
const PRC=()=>{const c=S.cfg.find(x=>x.id=='prices')||{};return{Petrol:c.Petrol||{sell:0,cost:0},Diesel:c.Diesel||{sell:0,cost:0}}};
const SET=s=>S.st.find(x=>x.id==s);
const meter=(s,p)=>{const l=S.sales.filter(x=>x.st==s).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts).pop();return l?l.lines.find(x=>x.p==p).c:(SET(s)?.meters?.[p]||0)};
const book=(s,p)=>{const t=SET(s)?.tanks?.[p]||{open:0};return(t.open||0)+sum(S.deliv.filter(x=>x.st==s&&x.pr==p),x=>x.l)-sum(S.sales.filter(x=>x.st==s),x=>x.L[p])},cap=(s,p)=>SET(s)?.tanks?.[p]?.cap||0;
async function wr(c,o,id){o.by=UID;o.byName=ME.name+' ('+RN[ME.role]+')';o.ts=Date.now();try{const col=DB.collection(c);if(id)await col.doc(id).set(o);else await col.add(o);return true}catch(e){alert('Could not save: '+(e.message||e.code));return false}}
async function upd(c,id,o){try{await DB.collection(c).doc(id).update(o);return true}catch(e){alert('Could not save: '+(e.message||e.code))}}
const lg=a=>DB.collection('audit').add({ts:Date.now(),u:ME.name+' ('+RN[ME.role]+')',a}).catch(()=>{});
async function del(c,id,key){if(!can('del')||!confirm('Delete this record permanently?'))return;await DB.collection(c).doc(id).delete();lg('Deleted '+key)}
function tbl(h,rows,nc=[]){return`<div class=tw><table><tr>${h.map((x,i)=>`<th class="${nc.includes(i)?'n':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${nc.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join('')||'<tr><td class=m>No records yet</td></tr>'}</table></div>`}
function csv(h,rows){const t=[h,...rows].map(r=>r.map(c=>'"'+String(c).replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='fuelx-report-'+TD()+'.csv';a.click()}
const stSel=(id,sel)=>ME.role=='mgr'?`<input id=${id} value="${ME.station}" readonly>`:`<select id=${id}>${ST.map(s=>`<option ${s==(sel||SC)?'selected':''}>${s}</option>`).join('')}</select>`;
const ro=m=>`<div class=msg>${m}</div>`;
const SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="FuelX Energy Ghana Limited"><g transform="translate(8 8) scale(1.6875)"><rect width="64" height="64" rx="14" fill="#0B2545"/><path d="M18 50L46 20" stroke="#0B2545" stroke-width="13" stroke-linecap="round"/><path d="M18 20L46 50" stroke="#1B8A5A" stroke-width="9" stroke-linecap="round"/><path d="M18 50L46 20" stroke="#F58220" stroke-width="9" stroke-linecap="round"/><path d="M32 6c3 5 6 7 6 11a6 6 0 0 1-12 0c0-2 1-4 3-5 0 2 1 3 2 3 0-3 0-6 1-9z" fill="#FFB24D"/></g><text x="128" y="62" font-family="Archivo,Arial Black,Arial,sans-serif" font-weight="800" font-size="46" fill="#0B2545" letter-spacing="1">FUEL<tspan fill="#F58220">X</tspan> ENERGY</text><text x="130" y="86" font-family="Archivo,Arial,sans-serif" font-weight="700" font-size="17" fill="#1B8A5A" letter-spacing="6">GHANA LIMITED</text><text x="130" y="106" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#566478">Safe Energy for All</text></svg>',LOGO=SVG,LOGOB=`<div class=lgb>${SVG}</div>`;
// ---------- login, registration, session (talks to the FUELX server) ----------
let VER=0,PT,TOK=null;try{TOK=localStorage.getItem('fx_tok')}catch(e){}
async function api(m,p,body){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK,'X-Auth-Token':TOK}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Server error');e.code=r.status;throw e}if(m!='GET'&&TOK){VER=-1;poll()}return j}
const mk=c=>({collection:n=>({doc:id=>({set:o=>api('PUT','/'+n+'/'+id,o),update:o=>api('PATCH','/'+n+'/'+id,o),delete:()=>api('DELETE','/'+n+'/'+id)}),add:o=>api('POST','/'+n,o)})});DB=mk();
async function poll(){clearTimeout(PT);if(!TOK)return;try{const j=await api('GET','/data?v='+VER);if(!j.same){VER=j.v;Object.keys(COLL).forEach(k=>{S[k]=j[k]||[];LOADED[k]=1});refresh()}}catch(e){if(e.code==401)return endSession('Your session expired. Please log in again.')}PT=setTimeout(poll,4000)}
function refresh(){if(Object.keys(COLL).some(k=>!LOADED[k]))return;ME=S.staff.find(x=>x.id==UID)||null;if(!ME||ME.status!='active')return endSession('Your account is not active.');const a=document.activeElement;if($('main')&&a&&/INPUT|SELECT/.test(a.tagName)&&$('main').contains(a)){dirty=true;return}dirty=false;if(!$('main'))shell();else go(V)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!/INPUT|SELECT/.test(document.activeElement.tagName))refresh()},400));
async function boot(){if(TOK){try{const j=await api('GET','/me');UID=j.user.id;$('app').innerHTML=`<div class="login card">${LOGOB}<p class=m style="text-align:center">Loading…</p></div>`;return poll()}catch(e){}}authScr('in')}
async function authScr(mode,msg){let first=false;try{first=(await api('GET','/status')).first}catch(e){}const reg=mode=='reg';
$('app').innerHTML=`<div class="login card">${LOGOB}<h3 style="text-align:center">${reg?'Staff registration':'Staff sign in'}</h3>${msg?ro(msg):''}${reg&&first?ro('You are the first user, so you will be registered as <b>CEO</b> with full access and will approve all other staff.'):''}
${reg?'<label>Full name</label><input id=rn><br><label>Phone number</label><input id=rp><br>':''}<label>Username</label><input id=lu autocapitalize=none autocomplete=username><br><label>${reg?'Choose your PIN / password (min 4 characters)':'PIN / password'}</label><input id=lw type=password autocomplete=${reg?'new-password':'current-password'} onkeydown="if(event.key=='Enter')${reg?'doReg()':'doLogin()'}"><br>
${reg&&!first?`<label>Role</label><select id=rr onchange="$('rs').style.display=this.value=='mgr'?'block':'none'"><option value=mgr>Station Manager</option><option value=ops>Operations Head</option><option value=acc>Accountant</option></select><div id=rs><br><label>Your station</label><select id=rst>${ST.map(s=>`<option>${s}</option>`).join('')}</select></div><br>`:''}
<button class=btn style="width:100%" onclick="${reg?'doReg()':'doLogin()'}">${reg?'Register':'Sign in'}</button><p style="text-align:center"><a href=# onclick="authScr('${reg?'in':'reg'}');return false">${reg?'Already registered? Sign in':'New staff? Register here'}</a></p></div>`}
async function doReg(){try{const o={username:$('lu').value,password:$('lw').value,name:$('rn').value,phone:$('rp').value,role:$('rr')?$('rr').value:'',station:$('rst')?$('rst').value:''};const j=await api('POST','/register',o);authScr('in',j.status=='active'?'Registered. You can now sign in.':'Registered. Your account must be approved by the CEO before you can sign in.')}catch(e){alert(e.message)}}
async function doLogin(){try{const j=await api('POST','/login',{username:$('lu').value,password:$('lw').value});TOK=j.token;try{localStorage.setItem('fx_tok',TOK)}catch(e){}UID=j.user.id;VER=0;Object.keys(LOADED).forEach(k=>delete LOADED[k]);V='dash';SC='ALL';$('app').innerHTML=`<div class="login card">${LOGOB}<p class=m style="text-align:center">Loading…</p></div>`;poll()}catch(e){alert(e.message)}}
function endSession(msg){clearTimeout(PT);TOK=null;ME=null;try{localStorage.removeItem('fx_tok')}catch(e){}Object.keys(LOADED).forEach(k=>delete LOADED[k]);authScr('in',msg)}
async function logout(){if(!confirm('Log out of FUELX?'))return;try{await api('POST','/logout')}catch(e){}endSession('You have logged out.')}
async function chpw(){const o=prompt('Enter your CURRENT PIN / password');if(o==null)return;const n=prompt('Enter your NEW PIN / password (min 4 characters)');if(!n)return;try{await api('POST','/password',{old:o,pw:n});alert('PIN changed')}catch(e){alert(e.message)}}
async function rst(id){const n=prompt('Enter a new temporary PIN for this person (min 4 characters). Tell it to them privately.');if(!n)return;try{await api('POST','/staff/'+id+'/reset',{password:n});alert('PIN reset. The person must use the new PIN to sign in.')}catch(e){alert(e.message)}}
async function bkp(){try{const j=await api('GET','/backup'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(j,null,1)],{type:'application/json'}));a.download='fuelx-backup-'+TD()+'.json';a.click()}catch(e){alert(e.message)}}
function shell(){$('app').innerHTML=`<header><div class=lg>${LOGO}</div><div style="flex:1"></div>${ME.role=='mgr'?`<b>${ME.station} Station</b>`:`<select style="width:auto" onchange="SC=this.value;go(V)"><option value=ALL>All 7 stations</option>${ST.map(s=>`<option ${SC==s?'selected':''}>${s}</option>`).join('')}</select>`}<span class=m>${ME.name} - ${RN[ME.role]}</span><button class="btn g s" onclick=chpw()>Change PIN</button><button class="btn g s" onclick=logout()>Log out</button></header><nav>${NAV.filter(n=>n[0]!='staff'||ME.role=='ceo').map(n=>`<button id=n_${n[0]} onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><main id=main></main>`;go(V)}
function go(v){V=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n_'+v));$('main').innerHTML=({dash,sales,stock,exp,bank,rep,set,staff})[v]();if(v=='sales'&&$('ss')){pumpTbl();$('ss').onchange=pumpTbl}}
// ---------- dashboard ----------
function dash(){const st=scope(),sa=by(S.sales,st),dates=[...new Set(sa.map(x=>x.date))].sort(),last=dates.slice(-1)[0],d7=dates.slice(-7),a7=sa.filter(x=>d7.includes(x.date)),lt=sa.filter(x=>x.date==last),e7=by(S.exp,st).filter(x=>d7.includes(x.date)),low=[];
st.forEach(s=>PR.forEach(p=>{if(SET(s)&&book(s,p)<.2*cap(s,p))low.push(s)}));const mx=Math.max(1,...st.map(s=>sum(a7.filter(x=>x.st==s),x=>x.sales))),un=st.filter(s=>!SET(s)),pr=PRC();
return`<div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div class=lg>${LOGO}</div><div><b style="font-size:16px">Management Dashboard</b><br><span class=m>${RN[ME.role]} view - ${st.length==7?'all 7 stations':st[0]}</span></div></div><h2>Dashboard <span class=m style="font-size:13px">latest data: ${last||'none yet'}</span></h2>${un.length&&ME.role!='acc'?ro('Setup needed (Operations Head): opening stock and meter readings for '+un.join(', ')+'.'):''}${!pr.Petrol.sell&&!pr.Diesel.sell?ro('Fuel prices have not been set yet (Prices &amp; Setup).'):''}<div class=grid>
<div class=kpi><span>Latest day sales</span><b>${M(sum(lt,x=>x.sales))}</b></div><div class=kpi><span>Latest day litres</span><b>${F(sum(lt,x=>x.L.Petrol+x.L.Diesel))} L</b></div><div class=kpi><span>7-day sales</span><b>${M(sum(a7,x=>x.sales))}</b></div><div class=kpi><span>7-day gross profit</span><b>${M(sum(a7,x=>x.sales-x.cogs))}</b></div><div class=kpi><span>7-day expenses</span><b>${M(sum(e7,x=>x.amt))}</b></div><div class=kpi><span>7-day cash variance</span><b class="${sum(a7,x=>x.diff)<0?'bad':'ok'}">${M(sum(a7,x=>x.diff))}</b></div><div class=kpi><span>Days awaiting verification</span><b>${sa.filter(x=>!x.verified).length}</b></div><div class=kpi><span>Low tank alerts</span><b class="${low.length?'bad':'ok'}">${low.length}</b></div></div><br>
<div class=card><h3>7-day sales by station</h3><div class=tw><table style="min-width:300px">${st.map(s=>{const v=sum(a7.filter(x=>x.st==s),x=>x.sales);return`<tr><td>${s}</td><td style="width:60%"><div class=bar><i style="width:${v/mx*100}%"></i></div></td><td class=n>${M(v)}</td></tr>`}).join('')}</table></div></div>
<div class=card><h3>Station status</h3>${tbl(['Station','Petrol stock','Diesel stock','Latest sales','Status'],st.map(s=>{const ls=S.sales.filter(x=>x.st==s).sort((a,b)=>b.date.localeCompare(a.date))[0],pc=p=>cap(s,p)?book(s,p)/cap(s,p)*100:0;return[s,F(book(s,'Petrol'))+' L',F(book(s,'Diesel'))+' L',ls?M(ls.sales)+' ('+ls.date+')':'-',!SET(s)?'<span class=m>Not set up</span>':(pc('Petrol')<20||pc('Diesel')<20)?'<span class=bad>Low stock</span>':ls&&Math.abs(ls.diff)>200?'<span class=bad>Cash variance</span>':'<span class=ok>OK</span>']}),[1,2,3])}</div>`}
// ---------- sales ----------
function sales(){const w=can('sale'),v=can('verify');
return`<h2>Daily Sales &amp; Pump Meter Readings</h2>${w?`<div class=card><h3>New day entry</h3><div class=f><div><label>Station</label>${stSel('ss')}</div><div><label>Date</label><input type=date id=sd value="${TD()}"></div></div><br><div class=tw><table id=pt></table></div><br><h3>Payments collected</h3><div class=f>${[['cash','Cash'],['momo','Mobile money'],['card','Card / POS'],['credit','Credit / coupons']].map(k=>`<div><label>${k[1]}</label><input type=number id=p_${k[0]} value=0 oninput=calcS()></div>`).join('')}</div><div id=ssum class=msg style="margin-top:12px"></div><button class=btn onclick=saveS()>Save day record</button></div>`:ro('Your role can view sales but not enter them.')}
<div class=card><h3>Sales history</h3>${tbl(['Date','Station','Petrol L','Diesel L','Expected','Collected','Variance','Entered by','Verified',''],by(S.sales,scope()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,80).map(x=>[x.date,x.st,F(x.L.Petrol),F(x.L.Diesel),M(x.sales),M(x.collected),`<span class="${x.diff<0?'bad':'ok'}">${F(x.diff)}</span>`,x.byName,x.verified?'<span class=ok>Yes - '+x.vname+'</span>':(v?`<button class="btn s" onclick="verS('${x.id}')">Verify</button>`:'Pending'),can('del')?`<a href=# onclick="del('sales','${x.id}','sales ${x.id}');return false">delete</a>`:'']),[2,3,4,5,6])}</div>`}
function pumpTbl(){const s=$('ss').value;if(!SET(s)){$('pt').innerHTML='<tr><td class=bad>This station is not set up yet. The Operations Head must enter opening stock and meter readings first.</td></tr>';return calcS()}
$('pt').innerHTML=`<tr><th>Pump</th><th>Product</th><th class=n>Opening meter</th><th class=n>Closing meter</th><th class=n>Litres</th><th class=n>Value</th></tr>`+PUMPS.map(([p,pr])=>`<tr><td>${p}</td><td>${pr}</td><td class=n>${F(meter(s,p))}</td><td><input type=number class=cl data-p="${p}" oninput=calcS() style="width:120px"></td><td class=n id=l_${p}>0</td><td class=n id=v_${p}>0</td></tr>`).join('');calcS()}
function calcS(){if(!$('ss'))return;const s=$('ss').value,pr=PRC();let v=0,l=0;if(SET(s))PUMPS.forEach(([p,r])=>{const c=parseFloat(document.querySelector(`.cl[data-p=${p}]`).value),q=isNaN(c)?0:c-meter(s,p);$('l_'+p).textContent=F(q);$('v_'+p).textContent=F(q*pr[r].sell);v+=Math.max(0,q)*pr[r].sell;l+=Math.max(0,q)});
const c=['cash','momo','card','credit'].reduce((t,k)=>t+(+$('p_'+k).value||0),0);window._c={v,c};$('ssum').innerHTML=`Litres: <b>${F(l)}</b> | Expected sales: <b>${M(v)}</b> | Collected: <b>${M(c)}</b> | Variance: <b class="${c-v<0?'bad':'ok'}">${M(c-v)}</b>`}
async function saveS(){const s=$('ss').value,d=$('sd').value,pr=PRC(),id=s+'_'+d;if(!SET(s))return alert('Station not set up yet.');if(!pr.Petrol.sell||!pr.Diesel.sell)return alert('Fuel prices have not been set by the Operations Head.');if(!own(s))return alert('You can only enter data for your own station.');
if(S.sales.some(x=>x.id==id))return alert('A record for this station and date already exists. Ask the CEO to delete it if it must be corrected.');const lines=[],L={Petrol:0,Diesel:0};let cg=0;
for(const[p,r]of PUMPS){const c=parseFloat(document.querySelector(`.cl[data-p=${p}]`).value),o=meter(s,p);if(isNaN(c)||c<o)return alert('Enter a valid closing meter for '+p+' (not below opening).');const l=c-o;lines.push({p,pr:r,o,c,l});L[r]+=l;cg+=l*pr[r].cost}
const pay={};['cash','momo','card','credit'].forEach(k=>pay[k]=+$('p_'+k).value||0);const{v,c}=window._c;if(await wr('sales',{st:s,date:d,lines,sales:v,cogs:cg,L,pay,collected:c,diff:c-v,verified:false},id))lg(`Sales ${s} ${d}: ${M(v)}`)}
async function verS(id){if(await upd('sales',id,{verified:true,vname:ME.name,vts:Date.now()}))lg('Verified sales '+id)}
// ---------- stock ----------
function stock(){const st=scope(),w=can('deliv');
return`<h2>Tanks, Deliveries &amp; Dip Readings</h2><div class=card><h3>Book stock (opening + deliveries - sales)</h3>${tbl(['Station','Product','Capacity','Book stock','Fill','Last dip','Dip variance'],st.flatMap(s=>PR.map(p=>{const b=book(s,p),d=S.dips.filter(x=>x.st==s&&x.pr==p).sort((a,b)=>a.ts-b.ts).pop();return[s,p,F(cap(s,p)),F(b),`<div class=bar><i style="width:${cap(s,p)?Math.min(100,b/cap(s,p)*100):0}%"></i></div>`,d?F(d.dip)+' ('+d.date+')':'-',d?`<span class="${Math.abs(d.v)>150?'bad':'ok'}">${F(d.v)} L</span>`:'-']})),[2,3])}</div>
${w?`<div class=card><h3>Record fuel delivery received</h3><div class=f><div><label>Station</label>${stSel('ds')}</div><div><label>Date</label><input type=date id=dd value="${TD()}"></div><div><label>Product</label><select id=dp>${PR.map(p=>`<option>${p}</option>`).join('')}</select></div><div><label>Litres received</label><input type=number id=dl></div><div><label>Supplier / depot</label><input id=dsu></div><div><label>Invoice / waybill no.</label><input id=di></div><div><label>Cost per litre (GH₵)</label><input type=number step=.01 id=dc></div><button class=btn onclick=addD()>Save delivery</button></div></div>
<div class=card><h3>Physical dip reading</h3><div class=f><div><label>Station</label>${stSel('ks')}</div><div><label>Date</label><input type=date id=kd value="${TD()}"></div><div><label>Product</label><select id=kp>${PR.map(p=>`<option>${p}</option>`).join('')}</select></div><div><label>Dip litres</label><input type=number id=kl></div><button class=btn onclick=addK()>Save dip</button></div></div>`:ro('Your role can view stock but not enter it.')}
<div class=card><h3>Recent deliveries</h3>${tbl(['Date','Station','Product','Litres','Supplier','Invoice','Cost/L','By',''],by(S.deliv,st).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40).map(x=>[x.date,x.st,x.pr,F(x.l),x.sup,x.inv,F(x.cpl),x.byName,can('del')?`<a href=# onclick="del('deliveries','${x.id}','delivery');return false">delete</a>`:'']),[3,6])}</div>`}
async function addD(){const s=$('ds').value,l=+$('dl').value;if(!l||!own(s))return alert('Enter litres for an allowed station');if(!SET(s))return alert('Station not set up yet.');if(await wr('deliveries',{st:s,date:$('dd').value,pr:$('dp').value,l,sup:$('dsu').value,inv:$('di').value,cpl:+$('dc').value||PRC()[$('dp').value].cost}))lg(`Delivery ${l}L ${$('dp').value} at ${s}`)}
async function addK(){const s=$('ks').value,p=$('kp').value,dip=+$('kl').value;if(!dip||!own(s))return alert('Enter dip litres');if(await wr('dips',{st:s,pr:p,date:$('kd').value,dip,v:dip-book(s,p)}))lg(`Dip ${dip}L ${p} at ${s}`)}
// ---------- expenses & banking ----------
function exp(){const w=can('exp');return`<h2>Expenses</h2>${w?`<div class=card><div class=f><div><label>Station</label>${stSel('es')}</div><div><label>Date</label><input type=date id=ed value="${TD()}"></div><div><label>Category</label><select id=ec>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Description</label><input id=edc></div><div><label>Amount (GH₵)</label><input type=number id=ea></div><button class=btn onclick=addE()>Add expense</button></div></div>`:ro('Your role can view expenses but not enter them.')}
<div class=card>${tbl(['Date','Station','Category','Description','Amount','By',''],by(S.exp,scope()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,80).map(x=>[x.date,x.st,x.cat,x.desc,M(x.amt),x.byName,(can('del')||(ME.role=='acc'&&x.by==UID))?`<a href=# onclick="delE('${x.id}');return false">delete</a>`:'']),[4])}</div>`}
async function addE(){const a=+$('ea').value,s=$('es').value;if(!a||!own(s))return alert('Enter amount');if(await wr('expenses',{st:s,date:$('ed').value,cat:$('ec').value,desc:$('edc').value,amt:a}))lg(`Expense ${M(a)} ${$('ec').value} at ${s}`)}
async function delE(id){if(!confirm('Delete this expense?'))return;await DB.collection('expenses').doc(id).delete();lg('Deleted expense '+id)}
function bank(){const w=can('bank'),st=scope();return`<h2>Cash &amp; Banking</h2><div class=card><h3>Cash position (cash collected - cash banked)</h3>${tbl(['Station','Cash collected','Momo / card / credit','Banked','Unbanked cash'],st.map(s=>{const a=S.sales.filter(x=>x.st==s),c=sum(a,x=>x.pay.cash),o=sum(a,x=>x.pay.momo+x.pay.card+x.pay.credit),b=sum(S.bank.filter(x=>x.st==s),x=>x.amt);return[s,M(c),M(o),M(b),`<b class="${c-b>5000?'bad':''}">${M(c-b)}</b>`]}),[1,2,3,4])}</div>
${w?`<div class=card><h3>Record bank deposit</h3><div class=f><div><label>Station</label>${stSel('bs')}</div><div><label>Date</label><input type=date id=bd value="${TD()}"></div><div><label>Amount (GH₵)</label><input type=number id=ba></div><div><label>Bank / slip reference</label><input id=br></div><button class=btn onclick=addB()>Save deposit</button></div></div>`:ro('Your role can view banking but not enter it.')}
<div class=card><h3>Recent deposits</h3>${tbl(['Date','Station','Amount','Reference','By',''],by(S.bank,st).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(x=>[x.date,x.st,M(x.amt),x.ref,x.byName,can('del')?`<a href=# onclick="del('banking','${x.id}','deposit');return false">delete</a>`:'']),[2])}</div>`}
async function addB(){const a=+$('ba').value,s=$('bs').value;if(!a||!own(s))return alert('Enter amount');if(await wr('banking',{st:s,date:$('bd').value,amt:a,ref:$('br').value}))lg(`Deposit ${M(a)} at ${s}`)}
// ---------- reports ----------
function repData(){const st=scope(),f=RP.f||'2000-01-01',t=RP.to||'2999-12-31',ir=x=>x.date>=f&&x.date<=t,sa=by(S.sales,st).filter(ir),ex=by(S.exp,st).filter(ir),T=RP.t;
if(T=='sum')return{h:['Station','Petrol L','Diesel L','Sales','Collected','Variance'],r:st.map(s=>{const a=sa.filter(x=>x.st==s);return[s,F(sum(a,x=>x.L.Petrol)),F(sum(a,x=>x.L.Diesel)),M(sum(a,x=>x.sales)),M(sum(a,x=>x.collected)),F(sum(a,x=>x.diff))]}),n:[1,2,3,4,5]};
if(T=='log')return{h:['Date','Station','Litres','Sales','Cash','Momo','Card','Credit','Variance','Entered by'],r:sa.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.st,F(x.L.Petrol+x.L.Diesel),F(x.sales),F(x.pay.cash),F(x.pay.momo),F(x.pay.card),F(x.pay.credit),F(x.diff),x.byName]),n:[2,3,4,5,6,7,8]};
if(T=='pl')return{h:['Station','Revenue','Cost of fuel','Gross profit','Expenses','Net profit','Margin %'],r:st.map(s=>{const a=sa.filter(x=>x.st==s),r=sum(a,x=>x.sales),c=sum(a,x=>x.cogs),e=sum(ex.filter(x=>x.st==s),x=>x.amt);return[s,M(r),M(c),M(r-c),M(e),M(r-c-e),r?((r-c-e)/r*100).toFixed(1):'0']}),n:[1,2,3,4,5,6]};
if(T=='stk')return{h:['Station','Product','Delivered (period)','Sold (period)','Book stock now','Last dip variance'],r:st.flatMap(s=>PR.map(p=>{const d=S.dips.filter(x=>x.st==s&&x.pr==p).sort((a,b)=>a.ts-b.ts).pop();return[s,p,F(sum(S.deliv.filter(x=>x.st==s&&x.pr==p&&ir(x)),x=>x.l)),F(sum(sa.filter(x=>x.st==s),x=>x.L[p])),F(book(s,p)),d?F(d.v):'-']})),n:[2,3,4,5]};
if(T=='exp')return{h:['Category',...st,'Total'],r:CATS.map(c=>{const v=st.map(s=>sum(ex.filter(x=>x.st==s&&x.cat==c),x=>x.amt));return[c,...v.map(F),F(sum(v,x=>x))]}),n:st.map((_,i)=>i+1).concat(st.length+1)};
if(T=='var')return{h:['Date','Station','Expected','Collected','Variance','Manager'],r:sa.filter(x=>Math.abs(x.diff)>100).sort((a,b)=>a.diff-b.diff).map(x=>[x.date,x.st,F(x.sales),F(x.collected),`<span class=bad>${F(x.diff)}</span>`,x.byName]),n:[2,3,4]};
return{h:['Station','Cash collected','Banked (period)','Gap'],r:st.map(s=>{const c=sum(sa.filter(x=>x.st==s),x=>x.pay.cash),b=sum(S.bank.filter(x=>x.st==s&&ir(x)),x=>x.amt);return[s,M(c),M(b),M(c-b)]}),n:[1,2,3]}}
function rep(){const o=[['sum','Sales summary by station'],['log','Daily sales log'],['pl','Profit & loss'],['stk','Stock reconciliation'],['exp','Expenses by category'],['var','Cash variance / shortages'],['cb','Cash vs banking']],d=repData();
return`<h2>Reports</h2><div class="card np"><div class=f><div><label>Report</label><select onchange="RP.t=this.value;go('rep')">${o.map(x=>`<option value=${x[0]} ${RP.t==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div><label>From</label><input type=date value="${RP.f||''}" onchange="RP.f=this.value;go('rep')"></div><div><label>To</label><input type=date value="${RP.to||''}" onchange="RP.to=this.value;go('rep')"></div><button class="btn g" onclick="csv(repData().h,repData().r)">Export CSV</button><button class=btn onclick=print()>Print / PDF</button></div></div>
<div class=card><div class=lg style="display:inline-block;margin-bottom:8px">${LOGO}</div><h3>FUELX ENERGY GHANA LIMITED - ${o.find(x=>x[0]==RP.t)[1]}</h3><p class=m>${scope().length==7?'All stations':scope()[0]} | Generated ${new Date().toLocaleString()}</p>${tbl(d.h,d.r,d.n)}</div>`}
// ---------- prices, setup, audit ----------
function set(){const p=PRC(),w=can('price'),su=can('setup');
return`<h2>Fuel Prices, Station Setup &amp; Audit</h2><div class=card><h3>Pump prices (Operations Head / CEO)</h3><div class=f>${PR.map(x=>`<div><label>${x} selling price / L</label><input type=number step=.01 id=sp_${x} value="${p[x].sell||''}" ${w?'':'disabled'}></div><div><label>${x} cost price / L</label><input type=number step=.01 id=cp_${x} value="${p[x].cost||''}" ${w?'':'disabled'}></div>`).join('')}${w?'<button class=btn onclick=savP()>Save prices</button>':''}</div></div>
${su?`<div class=card><h3>Station setup: opening stock and meter readings</h3><p class=m>Do this once per station before any sales are entered. Enter what is physically in the tanks and on the pump meters on the day you start using the system.</p><div class=f><div><label>Station</label><select id=us onchange=fillU()>${ST.map(s=>`<option>${s}</option>`).join('')}</select></div>${PR.map(x=>`<div><label>${x} tank capacity (L)</label><input type=number id=uc_${x}></div><div><label>${x} opening stock (L)</label><input type=number id=uo_${x}></div>`).join('')}${PUMPS.map(([p,r])=>`<div><label>${p} (${r}) opening meter</label><input type=number id=um_${p}></div>`).join('')}<button class=btn onclick=savU()>Save station setup</button></div></div>`:''}
<div class=card><h3>Setup status</h3>${tbl(['Station','Set up','Petrol cap','Diesel cap'],ST.map(s=>[s,SET(s)?'<span class=ok>Yes</span>':'<span class=bad>No</span>',F(cap(s,'Petrol')),F(cap(s,'Diesel'))]),[2,3])}</div>
<div class=card><h3>Audit trail</h3>${tbl(['Time','User','Action'],[...S.log].sort((a,b)=>b.ts-a.ts).slice(0,60).map(x=>[new Date(x.ts).toLocaleString(),x.u,x.a]))}</div>`}
function fillU(){const s=$('us').value,x=SET(s);PR.forEach(r=>{$('uc_'+r).value=x?.tanks?.[r]?.cap||'';$('uo_'+r).value=x?.tanks?.[r]?.open||''});PUMPS.forEach(([p])=>$('um_'+p).value=x?.meters?.[p]||'')}
async function savP(){const o={};PR.forEach(x=>o[x]={sell:+$('sp_'+x).value,cost:+$('cp_'+x).value});if(await wr('config',o,'prices'))lg(`Prices set: Petrol ${o.Petrol.sell}, Diesel ${o.Diesel.sell}`)}
async function savU(){const s=$('us').value;if(S.sales.some(x=>x.st==s)&&!confirm('This station already has sales. Changing setup will change stock figures. Continue?'))return;const tanks={},meters={};PR.forEach(r=>tanks[r]={cap:+$('uc_'+r).value,open:+$('uo_'+r).value});PUMPS.forEach(([p])=>meters[p]=+$('um_'+p).value);if(await wr('stations',{tanks,meters},s)){lg('Station setup saved: '+s);alert('Saved')}}
// ---------- staff (CEO) ----------
function staff(){return`<h2>Staff &amp; Access (CEO)</h2><div class=card><p class=m>New staff register themselves, then appear here as pending. Approve, change role or station, or suspend access. Staff register at the website address with their own username and PIN, then appear here for your approval. Use Reset PIN if someone forgets theirs.</p>${tbl(['Name','Phone','Role','Station','Status','Actions'],S.staff.map(x=>[x.name+' <span class=m>('+x.username+')</span>',x.phone||'',`<select onchange="stf('${x.id}',{role:this.value})">${Object.entries(RN).map(([k,v])=>`<option value=${k} ${x.role==k?'selected':''}>${v}</option>`).join('')}</select>`,`<select onchange="stf('${x.id}',{station:this.value})"><option value="">-</option>${ST.map(s=>`<option ${x.station==s?'selected':''}>${s}</option>`).join('')}</select>`,x.status=='active'?'<span class=ok>active</span>':'<span class=bad>'+x.status+'</span>',`<button class="btn g s" onclick="rst('${x.id}')">Reset PIN</button> `+(x.id==UID?'(you)':x.status=='active'?`<button class="btn g s" onclick="stf('${x.id}',{status:'suspended'})">Suspend</button>`:`<button class="btn s" onclick="stf('${x.id}',{status:'active'})">Approve</button>`)]))}<p><button class="btn g s" onclick=bkp()>Download full backup</button></p></div>`}
async function stf(id,o){if(await upd('staff',id,o))lg('Staff '+id.slice(0,6)+' updated: '+JSON.stringify(o))}
$('ll').innerHTML=LOGOB;boot();
</script></body></html>
